name: Scrape discord devportal

on:
    schedule:
        - cron: '*/5 * * * *'
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            packages: write
            pull-requests: write
            issues: write
            statuses: write
            deployments: write

        steps:
            - name: Checkout discord_developers branch
              uses: actions/checkout@v4
              with:
                  ref: discord_developers

            - name: Use Node.js
              uses: actions/setup-node@v3
              with:
                  node-version: '24.x'

            - name: Install npm dependencies
              run: npm install

            - name: Set IS_DEVPORTAL to true
              run: export IS_DEVPORTAL=true

            - name: Run script
              run: rm -rf build/chunks && mkdir -p build/chunks && npm run build && npm run start

            - name: Set git identity
              run: |
                  git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git config --local user.name "github-actions[bot]"

            - name: Commit & push changes
              run: |
                  git add --all
                  git diff-index --quiet HEAD || git commit -am "✨New build $(node getBuildInfo.js)"
                  git push
